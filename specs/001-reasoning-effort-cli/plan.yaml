implementation_phases:
  - phase: 1
    name: "Freeze request and policy-boundary contracts"
    goal: "Create failing tests for exact pass-through, omission, unfamiliar values, no client defaults, no run-type model/provider injection, and unchanged legacy invocations before modifying production code."
    deliverables:
      - "Focused red tests for --reasoning-effort and JSON/YAML/Markdown configuration paths."
      - "DTO and repository serialization tests proving reasoningEffort is exact when present and absent when omitted."
      - "Compatibility tests proving Basic/Pro retain runType behavior without client-selected opencodeModel/opencodeProvider."
      - "Service rejection test proving established errors are returned without fallback or silent retry."
  - phase: 2
    name: "Implement opaque optional request transport"
    goal: "Make request tests pass by removing client policy catalogs/defaults and carrying the optional string through established layers."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Cobra flag and task-file inputs mapped unchanged into RunConfig, domain.CreateRunRequest, and dto.CreateRunRequest."
      - "Reasoning-effort allowlist removed from client validation while structural validation remains intact."
      - "Run preset model/provider injection and inferred model display removed from create and dry-run flows."
      - "Omitted values verified to remain absent through omitempty serialization."
  - phase: 3
    name: "Propagate authoritative response policy"
    goal: "Add optional model and reasoning-effort response fields across both existing response model paths without rejecting unknown values."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Initially failing DTO, model, and repository tests for present, partial, absent, legacy, and unfamiliar policy values."
      - "Optional opaque policy fields in dto.RunResponse, domain.Run, models.RunResponse, and output run JSON mappings."
      - "Repository conversions that copy service-returned values exactly and never reconstruct them from the request."
      - "Contract fixtures for wrapped and direct run responses plus list-backed TUI data."
  - phase: 4
    name: "Render policy in supported CLI and TUI details"
    goal: "Display authoritative policy conditionally in all established detail surfaces while preserving legacy layouts and copy behavior."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Initially failing CLI status human/JSON renderer tests for complete, partial, absent, and unfamiliar values."
      - "Conditional Model and Reasoning effort rows in printRunDetails and run JSON output."
      - "Conditional opaque policy fields in RunDetailsView.renderOptionalFields."
      - "Conditional dashboard detailLines with full original values retained for copy operations."
  - phase: 5
    name: "Documentation and offline regression validation"
    goal: "Align public documentation and produce complete local cost-free acceptance evidence."
    dependencies:
      - "Phase 4"
    deliverables:
      - "API and configuration docs updated to remove client-owned model/effort catalogs and defaults."
      - "Focused changed-package tests passing after recorded red-green cycles."
      - "REPOBIRD_API_KEY='' make test passing."
      - "REPOBIRD_API_KEY='' make test-integration passing when feasible."
      - "make check passing when practical, with confirmation that no live, production-adjacent, paid, or billable validation ran."

open_questions:
  - question: "Which public run response JSON keys will the service expose for the selected model and reasoning effort?"
    context: "The current local repobird-next public serializer does not yet expose either field, while persistence uses opencodeModel and opencodeReasoningEffort and the CLI request uses reasoningEffort. Exact tags must match the versioned public API contract."
    proposed_resolution: "Confirm the sibling service contract before production edits. Prefer opencodeModel for the model and reasoningEffort for the public reasoning value; if a rollout must consume opencodeReasoningEffort, support it as a decoding compatibility alias while presenting one canonical CLI field."

