research_findings:
  decisions:
    - topic: "Optional reasoning-effort representation"
      decision: "Keep reasoning effort as a plain optional string at all client layers and rely on json/yaml omitempty for absence."
      rationale: "A string preserves exact user and future server values, while the zero value naturally omits the request field and avoids client policy ownership."
      alternatives_considered:
        - "A closed Go enum of known efforts"
        - "A CLI-selected default such as max"
        - "A pointer field solely to distinguish empty from omitted"
    - topic: "Client-side validation boundary"
      decision: "Remove the low/medium/high/max/xhigh allowlist from RunConfig validation and limit validation to existing structural request requirements."
      rationale: "The specification requires unfamiliar syntactically valid values to reach the service unchanged, which is incompatible with a client-owned policy catalog."
      alternatives_considered:
        - "Retain the current allowlist"
        - "Add provider-specific compatibility tables"
        - "Silently normalize unknown values to a known fallback"
    - topic: "Model and provider selection authority"
      decision: "Stop deriving opencodeModel and opencodeProvider from Basic/Pro run presets during request construction; submit runType and optional user preference, then display the service-selected response values."
      rationale: "Existing modelForRunType/providerForRunType injection conflicts with the binding constitution and would make the CLI authoritative for model policy. Basic/Pro command compatibility can remain through runType without hardcoded model choice."
      alternatives_considered:
        - "Keep hardcoded run preset model IDs"
        - "Move the same catalog into a configuration file"
        - "Infer the displayed model from runType"
    - topic: "Response propagation architecture"
      decision: "Add optional model and reasoning-effort strings to both API-facing response models used by the repository/domain CLI path and the models.RunResponse path used by status and TUI views."
      rationale: "The repository currently has two established response paths. Updating both avoids inferred values and ensures CLI status, machine JSON, dedicated details, and dashboard details consume the same server data safely."
      alternatives_considered:
        - "Render directly from raw JSON"
        - "Update only the TUI model"
        - "Derive response policy from the original request"
    - topic: "Supported display surfaces"
      decision: "Conditionally display non-empty server-returned policy in status human output, status/create/wait JSON mappings where run details are emitted, RunDetailsView, and DashboardView detail lines."
      rationale: "These are the existing CLI and terminal run-detail surfaces. Conditional rows preserve legacy usability and avoid invented placeholders."
      alternatives_considered:
        - "Always print unknown or default placeholders"
        - "Show policy only in JSON"
        - "Show policy only in the dedicated TUI details view"
    - topic: "Unknown future response values"
      decision: "Store and render policy values as opaque strings without display-name switches or rejection."
      rationale: "Plain strings preserve forward compatibility and allow the service to evolve model and effort policy independently of CLI releases."
      alternatives_considered:
        - "Map known model IDs to a closed display-name catalog"
        - "Reject unknown response values during unmarshal"
        - "Replace unknown values with Other"
    - topic: "Validation strategy"
      decision: "Use focused unit and serialization tests plus local httptest repository tests, then run make test, make test-integration, and make check when practical with credentials cleared."
      rationale: "This gives direct evidence at each boundary and satisfies the constitution without contacting live or paid infrastructure."
      alternatives_considered:
        - "Live service end-to-end validation"
        - "Manual TUI inspection as the only renderer check"
        - "Snapshot tests without request-boundary assertions"

data_model:
  entities:
    - name: "Run Request"
      description: "A create-run request assembled from flags, stdin, or JSON/YAML/Markdown configuration, with an optional opaque reasoning-effort preference."
      fields:
        - name: "reasoning_effort"
          type: "optional string"
          description: "Exact user-supplied preference serialized as reasoningEffort when non-empty."
          constraints: "Must remain unchanged; omitted when absent; no client-owned enum, eligibility, default, normalization, retry, or fallback."
        - name: "run_type"
          type: "string"
          description: "Existing Basic, Pro, run, or plan compatibility signal sent to the service."
          constraints: "Existing compatibility validation remains; must not be converted into a client-selected model or provider."
        - name: "existing_submission_fields"
          type: "composite"
          description: "Prompt, repository, branch/output, credentials references, context, files, and idempotency inputs already supported by the CLI."
          constraints: "Existing names, precedence, validation, omission, and error behavior remain compatible."
      relationships:
        - target: "Run Policy Result"
          type: "request-to-result"
          description: "The optional preference informs the service, but the returned policy result is authoritative and may differ or be absent."
    - name: "Run Policy Result"
      description: "Optional policy metadata returned by the service for an accepted or existing run."
      fields:
        - name: "model"
          type: "optional string"
          description: "The service-selected OpenCode model identifier displayed exactly as returned."
          constraints: "May be absent or unfamiliar; no client fallback, display-name allowlist, or rejection."
        - name: "reasoning_effort"
          type: "optional string"
          description: "The service-selected reasoning effort displayed exactly as returned."
          constraints: "May be absent or unfamiliar; must not be reconstructed from the request."
      relationships:
        - target: "Run Request"
          type: "result-of"
          description: "Represents the service decision for a submitted request, not a client-side assumption about that request."

api_contracts:
  endpoints:
    - method: "POST"
      path: "/api/v1/runs"
      description: "Create a run with an optional reasoningEffort preference while leaving final model and reasoning policy to the service."
      request:
        content_type: "application/json"
        body_schema: "Existing CreateRunRequest plus optional reasoningEffort:string with omitempty; omit opencodeModel and opencodeProvider unless a separately versioned compatibility contract explicitly requires them."
      response:
        success_code: 201
        body_schema: "Existing create response. Any returned model or reasoning policy fields are optional and must be preserved as opaque strings when present."
      errors:
        - code: 400
          description: "The service rejects malformed input or an unsupported policy preference through the existing API error path; the CLI does not silently retry with a fallback."
        - code: 401
          description: "Authentication failure is preserved through existing CLI error and exit behavior."
        - code: 409
          description: "Existing conflict or duplicate-submission behavior remains unchanged."
    - method: "GET"
      path: "/api/v1/runs/{id}"
      description: "Retrieve one run, including optional service-selected model and reasoning-effort policy for CLI and dedicated TUI details."
      request:
        content_type: "application/json"
        body_schema: "No request body; existing run identifier path parameter."
      response:
        success_code: 200
        body_schema: "Existing run response plus optional opaque model and reasoning-effort strings; either, both, or neither may be present."
      errors:
        - code: 404
          description: "Run is absent or inaccessible; existing error handling remains unchanged."
        - code: 429
          description: "Rate-limit response remains handled by the established API error path."
    - method: "GET"
      path: "/api/v1/runs"
      description: "List runs for dashboard and list-backed detail views, preserving optional policy metadata on each returned run."
      request:
        content_type: "application/json"
        body_schema: "No request body; existing pagination and filter query parameters."
      response:
        success_code: 200
        body_schema: "Existing paginated run list; each item may contain optional opaque model and reasoning-effort strings."
      errors:
        - code: 401
          description: "Authentication failure remains unchanged."
        - code: 429
          description: "Rate-limit response remains unchanged."

