plan:
  branch: "agent/reasoning-effort-autospec"
  created: "2026-08-15"
  spec_path: "specs/001-reasoning-effort-cli/spec.yaml"

summary: |
  Implement reasoning-effort as an optional, opaque transport preference across the existing Cobra command, JSON/YAML/Markdown configuration, domain, repository, and API DTO layers. The CLI will preserve an explicitly supplied string exactly, omit it when absent, remove client-owned reasoning catalogs and defaults, and stop injecting run-type-derived model/provider selections so the RepoBird service remains authoritative for final policy.

  Extend run response models and renderers to carry and display the service-selected OpenCode model and reasoning effort in CLI status/JSON output and both supported Bubble Tea detail views. Changes will follow red-green-refactor order with local fixtures and httptest-based contract tests covering explicit values, omission, unfamiliar future values, legacy responses, partial responses, service errors, and unchanged invocations. No live or billable validation is permitted.

technical_context:
  language: "Go 1.24.5"
  framework: "Cobra 1.9.1 for CLI commands; Bubble Tea 1.3.6 with Bubbles 0.21.0 and Lip Gloss 1.1.0 for the TUI"
  primary_dependencies:
    - name: "github.com/spf13/cobra"
      version: "v1.9.1"
      purpose: "Expose the optional --reasoning-effort run flag while preserving existing command and flag behavior."
    - name: "github.com/charmbracelet/bubbletea"
      version: "v1.3.6"
      purpose: "Render server-returned run policy in existing message-driven terminal views."
    - name: "github.com/charmbracelet/lipgloss"
      version: "v1.1.0"
      purpose: "Preserve established styling for conditional model and reasoning-effort detail rows."
    - name: "github.com/stretchr/testify"
      version: "v1.10.0"
      purpose: "Express request serialization, response mapping, renderer, and compatibility assertions."
  storage: "None; the feature adds no client persistence and uses existing in-memory request/response models and cache behavior."
  testing:
    framework: "Go testing package with testify assertions, local fixtures, mock services, and net/http/httptest"
    approach: "Write focused failing tests before each behavior change, then run affected package tests, make test, make test-integration for command coverage, and make check when practical. Clear REPOBIRD_API_KEY and use only local deterministic responses."
  target_platform: "Linux, macOS, and Windows CLI/TUI builds on amd64 and arm64, consistent with existing Go cross-compilation targets"
  project_type: "cli"
  performance_goals: "No additional network requests; optional fields add constant-time serialization and rendering, and 100% of present, omitted, legacy, partial, and unfamiliar-value scenarios must render or submit without unintended failure."
  constraints:
    - "Model selection, reasoning defaults, eligibility, normalization, and fallback behavior remain server-authoritative."
    - "An omitted reasoning-effort preference must remain absent from JSON through omitempty semantics."
    - "User-supplied reasoning-effort strings must pass through without a client-maintained allowed-value catalog."
    - "Existing commands, aliases, configuration formats, JSON schemas, exit behavior, and no-preference workflows must remain compatible."
    - "TUI changes must use existing models and render paths without introducing direct navigation outside internal/tui/app.go."
    - "All acceptance evidence must be local, deterministic, credential-free, cost-free, and isolated from production or paid services."
    - "Production code changes require test-first red-green-refactor evidence."
  scale_scope: "A surgical cross-layer CLI change affecting one optional create-run request field, two optional run policy response fields, CLI status/create output, and the existing dedicated and dashboard TUI detail renderers."

