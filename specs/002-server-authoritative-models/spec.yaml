# ============ REQUIRED SECTIONS ============

feature:
  branch: "002-server-authoritative-models"
  created: "2026-08-15"
  status: "Draft"
  input: |
    Mission: implement the approved repobird-cli-5vd server-authoritative model discovery and submission workflow through specify, plan, tasks, implementation, and local acceptance. Exit condition: a clean committed CLI worktree satisfies the Bead acceptance criteria and the repobird-next tasks T061-T067 and T072 contracts, with exact validation evidence and no live/costly calls. Worktree: /home/ari/repos/repobird-cli/.worktrees/agent/repobird-cli-5vd; all writes and file operations stay inside this worktree. Branch/base: agent/repobird-cli-5vd from local dev commit 4ab3c83. Bead/spec: repobird-cli-5vd, Autospec required. Read-only server contract sources: /home/ari/repos/repobird-next/.worktrees/agent/repobird-next-d9ax-central-model-policy/docs/CLI_API_SPECIFICATION.yaml, docs/CLI_API_ENDPOINTS.md, specs/038-centralize-model-policy/tasks.yaml, and the public GET /api/v1/models route/tests. Never edit sibling repositories. Required behavior: add built 'repobird models' human and stable JSON discovery backed by GET /api/v1/models; public DTOs and client behavior must preserve unknown safe future fields/values and omit all internal policy data. Basic and Pro run commands must stop sending CLI-owned default model IDs and rely on server resolution while preserving existing flags/scripts. Add explicit --opencode-model and --opencode-provider request/config pass-through on this current base as needed to satisfy selected-model submission; server admission remains authoritative and the CLI never substitutes or silently falls back. A bounded cache may support visibly stale offline display but is never authoritative for admission. Preserve authentication, provider/credential behavior, JSON error stability, output contracts, and backward compatibility. The older branch agent/repobird-cli-4y6 at 6a1aa8c is not an ancestor and must not be merged, rebased, reset onto, or edited; use it only as read-only compatibility evidence and ensure this feature subsumes its relevant explicit-flag behavior on the current base. Constitution: TDD is non-negotiable. Record failing focused tests before production changes. Validation must be local and cost-free with httptest/fixtures, clearing credentials and never calling live RepoBird or provider endpoints. Required checks: focused Go package tests, race tests for affected packages where practical, make test, make test-integration for command changes, make check, built-binary models human/JSON and run request serialization acceptance against a local httptest server, git diff --check, and Autospec artifact validation. Use no release or live API. Stage explicit files only and make bounded conventional commits; do not use git add -A. Report: spec path, changed files, commits, exact checks/results, risk/blast radius/rollback, compatibility evidence, unresolved issues, and exactly one next action. Forbidden: Bead/provider mutation, sibling edits, worktree creation/removal, delegation, merge, push, cleanup, release/tagging, production or preview calls, live credentials, provider spend, or claiming final cross-repo completion. Lifecycle owner: root owns review and handoff; merge-wt owns landing and cleanup.

user_stories:
  - id: "US-001"
    title: "Discover the current public model catalog"
    priority: "P1"
    as_a: "RepoBird CLI user"
    i_want: "to list the server-provided models in human-readable or stable JSON output"
    so_that: "I can choose supported models without relying on stale client-maintained catalogs"
    why_this_priority: "Discovery is the entry point for safe model selection and is required for the cross-repository contract."
    independent_test: "Run the built CLI against a local HTTP fixture that serves the public catalog and compare human and JSON output with the fixture."
    acceptance_scenarios:
      - given: "A local server returns a valid public model catalog with deterministic descriptors and one default"
        when: "The user runs repobird models"
        then: "The CLI requests GET /api/v1/models and renders every public descriptor without adding client-selected models or policy details."
      - given: "A local server returns the same catalog in a valid response"
        when: "The user runs repobird models --json"
        then: "The CLI emits stable machine-readable JSON containing the catalog revision and public model descriptors."
      - given: "The discovery endpoint returns a stable public error"
        when: "The user runs either output mode"
        then: "The CLI preserves the stable error code and does not expose credentials, policy internals, or an invented fallback catalog."

  - id: "US-002"
    title: "Submit an explicitly selected model"
    priority: "P1"
    as_a: "RepoBird CLI user"
    i_want: "to pass an explicitly selected OpenCode model and optional provider through flags or configuration"
    so_that: "the server can validate admission for exactly the value I selected"
    why_this_priority: "Explicit selection is necessary to consume discovery safely and must not be replaced by client guesses."
    independent_test: "Create a run through a local HTTP server, inspect the serialized request, and verify the selected model and provider are unchanged."
    acceptance_scenarios:
      - given: "The user supplies an OpenCode model and provider"
        when: "A run is submitted"
        then: "The request contains those values under the API contract field names with no normalization, substitution, or silent fallback."
      - given: "The server rejects the selected model or provider"
        when: "A run is submitted"
        then: "The CLI surfaces the server's stable error and does not retry with another model or create a different request."
      - given: "The user omits both optional selection values"
        when: "A run is submitted"
        then: "The CLI omits both fields and leaves model resolution to the server."

  - id: "US-003"
    title: "Preserve existing Basic and Pro workflows"
    priority: "P1"
    as_a: "Existing automation or CLI user"
    i_want: "Basic and Pro commands, scripts, input files, and legacy flags to keep their prior invocation shape"
    so_that: "the server-authoritative change does not break established workflows"
    why_this_priority: "Backward compatibility is a binding CLI contract and the migration must not require synchronized script changes."
    independent_test: "Run prior Basic and Pro command/configuration fixtures against a local server and assert accepted fields, omitted optional model fields, output shape, and exit behavior."
    acceptance_scenarios:
      - given: "A Basic or Pro invocation omits model selection"
        when: "The request is serialized"
        then: "No CLI-owned default model identifier is sent, while the existing run type, authentication, provider credentials, and output contracts remain intact."
      - given: "A legacy run configuration or flag set is used"
        when: "The command is executed"
        then: "Existing aliases and fields continue to work and the new optional fields do not alter behavior when absent."

  - id: "US-004"
    title: "Keep public model data safe and forward-compatible"
    priority: "P1"
    as_a: "RepoBird service consumer"
    i_want: "the CLI to retain safe future public fields and values while excluding internal policy information"
    so_that: "server evolution does not require a client release or leak tenant and worker data"
    why_this_priority: "The public catalog is an interoperability boundary and must remain safe under additive server changes."
    independent_test: "Serve additive unknown public fields and values plus forbidden internal-looking fields from a fixture, then verify safe data survives and internal data is absent from DTOs and output."
    acceptance_scenarios:
      - given: "The server adds an unknown non-sensitive public field or enum value"
        when: "The catalog is decoded and rendered"
        then: "The CLI preserves the additive safe value for JSON consumers and does not fail solely because it is unknown."
      - given: "The response includes policy hashes, worker profiles, credentials, tenant availability, or similar internal fields"
        when: "The catalog is decoded or displayed"
        then: "Those fields are omitted from public DTOs and output."

  - id: "US-005"
    title: "Validate locally without service or provider spend"
    priority: "P1"
    as_a: "CLI maintainer"
    i_want: "all feature validation to use local fixtures and isolated HTTP servers"
    so_that: "tests are deterministic and cannot consume live credentials or billable provider resources"
    why_this_priority: "Cost-free validation is a non-negotiable project constitution rule."
    independent_test: "Clear credentials, run focused and repository checks, exercise built-binary commands against httptest, and inspect network and worktree evidence."
    acceptance_scenarios:
      - given: "Credentials are absent or cleared"
        when: "The local test suite and built-binary acceptance run"
        then: "All required checks use only fixtures or local servers and do not call live RepoBird or provider endpoints."

requirements:
  functional:
    - id: "FR-001"
      description: "MUST provide a built repobird models command that retrieves the current sanitized public catalog from GET /api/v1/models."
      acceptance_criteria: "A local HTTP fixture observes GET /api/v1/models and the built binary succeeds with the fixture response."
    - id: "FR-002"
      description: "MUST provide human-readable model discovery output with deterministic ordering and all public descriptor values returned by the server."
      acceptance_criteria: "Human output from the built binary is compared with a fixture containing multiple descriptors and is stable across repeated runs."
    - id: "FR-003"
      description: "MUST provide stable JSON model discovery output containing the public response envelope, catalog revision, descriptors, and additive safe public fields."
      acceptance_criteria: "JSON output is parsed and compared against expected keys, values, ordering, and preservation of safe unknown fields."
    - id: "FR-004"
      description: "MUST preserve unknown safe future public fields and values during decoding and JSON rendering without treating them as client policy."
      acceptance_criteria: "A fixture with additive safe fields and unknown public enum values round-trips through the public DTO and JSON command output."
    - id: "FR-005"
      description: "MUST omit internal policy data, credentials, hashes, worker profiles, tenant-specific availability, and other non-public fields from public DTOs and output."
      acceptance_criteria: "Fixtures containing forbidden internal-looking fields produce no such fields in public DTO serialization, human output, or JSON output."
    - id: "FR-006"
      description: "MUST treat server admission and server resolution as authoritative and MUST NOT maintain a hard-coded catalog, select a client default, invent a fallback, or substitute a rejected model."
      acceptance_criteria: "Basic, Pro, and explicit-selection request tests prove omitted model fields remain omitted, rejected values are returned as server errors, and no second request is made with a different model."
    - id: "FR-007"
      description: "MUST preserve existing Basic and Pro flags, scripts, input formats, authentication, provider credential behavior, output contracts, and JSON error stability when optional model selection is omitted."
      acceptance_criteria: "Existing command and configuration fixtures pass against local HTTP servers and retain their prior request and output assertions except for removal of CLI-owned default model identifiers."
    - id: "FR-008"
      description: "MUST accept an optional --opencode-model value from direct command invocation and configuration and transmit it unchanged as opencodeModel."
      acceptance_criteria: "Flag and JSON/YAML configuration tests inspect the outgoing request and find the exact selected model value."
    - id: "FR-009"
      description: "MUST accept an optional --opencode-provider value from direct command invocation and configuration and transmit it unchanged as opencodeProvider."
      acceptance_criteria: "Flag and JSON/YAML configuration tests inspect the outgoing request and find the exact selected provider value."
    - id: "FR-010"
      description: "MUST preserve existing authentication and provider/credential fields while adding optional model/provider pass-through."
      acceptance_criteria: "Request serialization tests assert the Authorization behavior and existing credential fields remain unchanged alongside selected model fields."
    - id: "FR-011"
      description: "MAY use a bounded, visibly stale cache for offline discovery display, but MUST never use cached data to authorize or construct run admission requests."
      acceptance_criteria: "If cache behavior is implemented, tests mark stale output as stale and prove run submission still omits or sends only the user-selected value without consulting the cache."
    - id: "FR-012"
      description: "MUST preserve public error codes and machine-readable error structure for discovery and run submission failures."
      acceptance_criteria: "Local fixtures for 429, 500, 503, and unsupported-selection responses are rendered with stable codes and no secret or policy data."
    - id: "FR-013"
      description: "MUST keep discovery anonymous-compatible while retaining the existing authenticated client behavior for run creation and other protected endpoints."
      acceptance_criteria: "A local server verifies models discovery works with cleared credentials and protected run requests retain their existing authentication header behavior."

  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "Public output must never expose API keys, tokens, credential identifiers, tenant availability, policy documents, worker profiles, or hashes."
      measurable_target: "Zero forbidden fields or credential values appear in focused tests, built-binary output, or committed artifacts."
    - id: "NFR-002"
      category: "reliability"
      description: "Optional model fields must be omission-preserving and additive so existing callers retain prior server resolution behavior."
      measurable_target: "All omission and legacy compatibility tests pass with no model or provider field added when the user did not specify one."
    - id: "NFR-003"
      category: "code_quality"
      description: "The implementation must follow established Go client, command, DTO, configuration, and output patterns with focused functions and explicit errors."
      measurable_target: "Focused tests, race tests for affected packages where practical, make test, make test-integration, make check, and formatting/lint checks pass."
    - id: "NFR-004"
      category: "usability"
      description: "Human discovery output must make the current server-provided model identifiers, labels, providers, capabilities, and default marker understandable without requiring JSON parsing."
      measurable_target: "A representative catalog is readable from terminal output and includes every required public descriptor value exactly once."
    - id: "NFR-005"
      category: "reliability"
      description: "Local validation must be deterministic and cost-free."
      measurable_target: "Required acceptance commands complete with cleared credentials, local httptest/fixtures only, and no live or provider endpoint calls."

success_criteria:
  - id: "SC-001"
    description: "Users can discover the complete current public model catalog in either supported output mode."
    metric: "Successful local catalog requests rendered in human and JSON modes"
    target: "100% of representative fixture descriptors and required metadata are displayed without client-added values"
  - id: "SC-002"
    description: "Existing Basic and Pro submissions continue to work while allowing the service to resolve omitted models."
    metric: "Compatibility request and command fixtures"
    target: "All pre-existing focused compatibility cases pass and omitted model/provider fields remain absent"
  - id: "SC-003"
    description: "Explicit model selections reach the service unchanged and rejected selections are not silently changed."
    metric: "Serialized local HTTP submission requests and rejection cases"
    target: "Exact value preservation with zero fallback or substitution requests"
  - id: "SC-004"
    description: "Public catalog evolution remains additive for safe data and safe for internal data."
    metric: "Unknown-field/value and redaction fixture assertions"
    target: "Safe additive values survive JSON output while zero forbidden internal fields are emitted"
  - id: "SC-005"
    description: "The complete validation workflow remains local and cost-free."
    metric: "Command receipts and endpoint observations"
    target: "All required checks pass with cleared credentials and no non-local HTTP traffic"

key_entities:
  - name: "Public model catalog"
    description: "The server-provided sanitized collection of models usable as public discovery input."
    attributes:
      - "catalog revision"
      - "ordered public descriptors"
      - "default marker"
      - "safe additive fields"
  - name: "Public model descriptor"
    description: "A safe model selection option exposed by the service without tenant or worker internals."
    attributes:
      - "canonical identifier"
      - "label"
      - "public provider"
      - "capabilities"
      - "isDefault"
  - name: "Run submission"
    description: "A request to create a RepoBird run whose model policy is resolved and admitted by the service."
    attributes:
      - "run type"
      - "optional selected model"
      - "optional selected provider"
      - "authentication and credential fields"

edge_cases:
  - scenario: "The discovery response is empty, malformed, or missing the required public envelope."
    expected_behavior: "Return a stable user-safe error without inventing a catalog or sending a run request."
  - scenario: "The discovery response includes a safe unknown field or unknown public enum value."
    expected_behavior: "Preserve it for JSON consumers and avoid local validation or fallback based on the unknown value."
  - scenario: "The discovery response includes forbidden policy, credential, tenant, worker, or hash fields."
    expected_behavior: "Exclude those fields from public DTOs and output."
  - scenario: "The user omits model and provider values for Basic or Pro."
    expected_behavior: "Omit both request fields and let the server resolve the model."
  - scenario: "The user selects a model or provider that the server rejects."
    expected_behavior: "Return the stable server error unchanged in contract shape and do not retry with another selection."
  - scenario: "The local discovery response is unavailable and a stale cache exists."
    expected_behavior: "Only a visibly stale discovery display may use the cache; run admission never uses it."
  - scenario: "Credentials are absent during local validation."
    expected_behavior: "Discovery remains testable through the public local fixture and protected operations fail safely without live calls."

assumptions:
  - "The public GET /api/v1/models response envelope and opencodeModel/opencodeProvider request field names are the governing server contract."
  - "The current CLI should continue sending agent=opencode for existing run submissions unless an established compatibility path requires omission."
  - "Safe future fields are additive public fields that do not match known internal policy or credential data; internal allowlisting remains mandatory."
  - "No cache is required to complete the core feature; if introduced, it is bounded and visibly stale."
  - "The current branch already contains the prior reasoning-effort compatibility work and must be preserved."

constraints:
  - "All writes and file operations remain inside the assigned CLI worktree."
  - "Sibling repositories and the older agent/repobird-cli-4y6 branch are read-only compatibility evidence only."
  - "Do not mutate Beads or providers, create/remove worktrees, merge, push, release, or call live/costly endpoints."
  - "TDD is mandatory: focused failing tests must be recorded before production changes."
  - "Validation uses cleared credentials, httptest servers, fixtures, focused tests, race tests where practical, make test, make test-integration, make check, built-binary acceptance, diff checks, and Autospec validation."
  - "Stage explicit files only and leave a clean committed worktree for review and handoff."

out_of_scope:
  - "Changing the server model-policy implementation, route, admission logic, or sibling repository files."
  - "Authorizing models locally or adding a client-maintained provider catalog."
  - "Provider credential discovery, credential selection, tenant availability display, or policy-document exposure."
  - "Live RepoBird, provider, production, preview, deployment, release, or cost-incurring validation."
  - "Merging, pushing, closing the Bead, removing the worktree, or claiming cross-repository completion."

