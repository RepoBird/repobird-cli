research_findings:
  decisions:
    - topic: "Discovery DTO forward compatibility"
      decision: "Represent documented fields as typed values and retain only additive unknown JSON fields that pass a conservative internal-field filter; preserve unknown provider, capability, and other public string values as opaque strings."
      rationale: "The server may add safe public fields or values before the CLI releases, but public output must not become a container for policy, credential, tenant, worker, dispatch, secret, or hash data."
      alternatives_considered:
        - "Strictly reject every unknown field, rejected because safe additive server evolution would break older CLIs."
        - "Retain every unknown field, rejected because internal policy data must never enter public DTOs or output."
        - "Maintain a local model catalog, rejected because it duplicates server policy and drifts."
    - topic: "Conditional discovery requests"
      decision: "Expose request-scoped If-None-Match support in the client and handle 304 as an explicit not-modified result, but do not add a persistent catalog cache in this change."
      rationale: "The server contract supplies opaque ETag and catalogRevision metadata. Avoiding persistence keeps the feature bounded and guarantees cached data cannot affect run admission."
      alternatives_considered:
        - "Persist a catalog cache immediately, deferred because offline display is optional and adds stale-state UX and test surface."
        - "Ignore ETag and 304, rejected because the public contract explicitly defines conditional discovery behavior."
    - topic: "Run selection authority"
      decision: "Carry optional model and provider strings from direct flags or config through every existing request layer and omit both when empty; do not infer provider from model or run type."
      rationale: "The selected canonical ID must reach server admission unchanged, while Basic and Pro must rely on server resolution when no value is supplied."
      alternatives_considered:
        - "Infer provider from the model prefix, rejected because it rewrites user input and can conflict with credential authorization."
        - "Select defaults from Basic/Pro, rejected by the constitution and server contract."
        - "Validate against the discovered catalog before submit, rejected because discovery is not authorization and would add a local policy gate."
    - topic: "Command shape"
      decision: "Register `repobird models` as the primary command and provide `repobird models list` as an additive alias path using the same implementation."
      rationale: "The requested built command is short and script-friendly while the sibling T064 contract names a models-list command. Supporting both has no existing compatibility cost."
      alternatives_considered:
        - "Expose only `models list`, rejected because the approved user contract explicitly names `repobird models`."
        - "Expose only `models`, rejected because the cross-repo task names the list form."
    - topic: "Error and authentication behavior"
      decision: "Reuse the existing API error parser and authenticated client construction, suppressing an empty Authorization header only for anonymous-compatible discovery."
      rationale: "This preserves stable error codes and protected endpoint authentication while allowing local credential-free discovery tests."
      alternatives_considered:
        - "Use a second unauthenticated HTTP client, rejected because it duplicates URL, timeout, user-agent, and error behavior."
        - "Change protected request semantics, rejected because it risks existing auth and credential behavior."
    - topic: "Autospec execution fallback"
      decision: "Keep the validated spec and hand-author plan/tasks using the repository's existing valid artifact shape after the configured plan runner failed before generation because it passed an unsupported `-c` argument to the connected jcode CLI."
      rationale: "The failure is local tooling incompatibility, not a feature ambiguity. Manual artifacts remain schema-validated and preserve the requested specify → plan → tasks flow without retrying the broken command unchanged."
      alternatives_considered:
        - "Retry the same jcode-backed plan command, rejected because the error is deterministic and the skill forbids unchanged retries."
        - "Use an unapproved external or live provider fallback, rejected by routing and cost constraints."

data_model:
  entities:
    - name: "Public models response"
      description: "The public GET /api/v1/models envelope returned by the service."
      fields:
        - name: "data.catalogRevision"
          type: "string"
          description: "Opaque revision token used for display and conditional change detection."
          constraints: "Preserve exactly; never parse as policy or use for admission."
        - name: "data.models"
          type: "array of Public model descriptor"
          description: "Server-ordered sanitized model descriptors."
          constraints: "Preserve server order for JSON; human rendering uses deterministic order without adding entries."
        - name: "safe additive fields"
          type: "JSON object fields"
          description: "Unknown public fields that do not match conservative internal-field patterns."
          constraints: "Round-trip in JSON output; internal-looking fields are discarded."
    - name: "Public model descriptor"
      description: "One selectable public model option returned by the service."
      fields:
        - name: "id"
          type: "string"
          description: "Canonical requested model identifier."
          constraints: "Opaque and unchanged."
        - name: "label"
          type: "string"
          description: "User-facing public label."
          constraints: "Opaque and unchanged."
        - name: "provider"
          type: "string"
          description: "Public provider label."
          constraints: "Unknown future values are preserved."
        - name: "capabilities"
          type: "array of strings"
          description: "Public flow capability values."
          constraints: "Unknown future values are preserved."
        - name: "isDefault"
          type: "boolean"
          description: "Server-provided catalog default marker."
          constraints: "Display only; never used to construct a run."
    - name: "Run selection request"
      description: "Existing run request with optional explicit OpenCode selection."
      fields:
        - name: "opencodeModel"
          type: "optional string"
          description: "Exact user/config-selected model identifier."
          constraints: "Omit when empty; no client validation, aliasing, defaulting, or fallback."
        - name: "opencodeProvider"
          type: "optional string"
          description: "Exact user/config-selected provider binding."
          constraints: "Omit when empty; no inference from model or credentials."
        - name: "existing fields"
          type: "composite"
          description: "Run type, credentials, branches, prompt, context, files, and idempotency values."
          constraints: "Preserve names, precedence, and existing behavior."

api_contracts:
  endpoints:
    - method: "GET"
      path: "/api/v1/models"
      description: "Retrieve the anonymous-compatible sanitized public model catalog."
      request:
        content_type: "application/json"
        body_schema: "No request body; optional If-None-Match header carries an opaque prior ETag."
      response:
        success_code: 200
        body_schema: "PublicModelsResponse with data.catalogRevision, data.models, typed public fields, and safe additive fields."
      errors:
        - code: 304
          description: "Catalog is unchanged for the supplied ETag; return a not-modified result without decoding a body."
        - code: 429
          description: "Existing stable rate-limit error is parsed and surfaced without retry or local fallback."
        - code: 503
          description: "MODEL_POLICY_UNAVAILABLE remains a stable user-safe error."
        - code: 500
          description: "MODEL_CATALOG_UNAVAILABLE remains a stable user-safe error."
    - method: "POST"
      path: "/api/v1/runs"
      description: "Create a run with optional explicit model/provider values while leaving admission and defaulting to the server."
      request:
        content_type: "application/json"
        body_schema: "Existing create-run request plus optional opencodeModel and opencodeProvider with exact field names and omission semantics."
      response:
        success_code: 201
        body_schema: "Existing create response; service-returned model values remain opaque and existing compatibility aliases continue to decode."
      errors:
        - code: 400
          description: "Unsupported or invalid selection remains the server's stable admission error; the CLI does not silently retry or substitute."
        - code: 401
          description: "Existing authentication failure behavior remains unchanged."
        - code: 429
          description: "Existing rate-limit behavior remains unchanged."

