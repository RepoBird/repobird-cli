implementation_phases:
  - phase: 1
    name: "Freeze the public and submission contracts"
    goal: "Create all required focused red tests before production code changes and capture the local tooling blocker for generated planning."
    deliverables:
      - "DTO red tests for catalog fields, safe additive fields, internal-field redaction, and opaque unknown values."
      - "API client red tests for GET /api/v1/models, ETag/304, stable errors, and empty-credential discovery."
      - "Run/config/repository/command red tests for exact selected model/provider pass-through and omission on Basic/Pro."
      - "Models command red tests for human output, stable JSON, and error rendering."
  - phase: 2
    name: "Implement discovery transport and safe DTOs"
    goal: "Make public catalog decoding and client requests pass while retaining only safe public data."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Typed public model DTOs with additive-field preservation and conservative internal redaction."
      - "Models endpoint constant and client method with optional If-None-Match and explicit 304 handling."
      - "Existing error parsing and protected authentication behavior preserved."
  - phase: 3
    name: "Implement selected-model request pass-through"
    goal: "Make explicit flags and configuration reach the server unchanged while omitted values remain absent."
    dependencies:
      - "Phase 1"
      - "Phase 2"
    deliverables:
      - "RunRequest and RunConfig JSON/YAML fields for opencodeModel and opencodeProvider."
      - "Direct run and Basic/Pro preset flags with explicit values taking precedence over config where supplied."
      - "Domain and repository mapping preserving existing provider credential behavior and no inference/defaulting."
  - phase: 4
    name: "Add built discovery command and compatibility coverage"
    goal: "Expose human and stable JSON discovery and verify built CLI behavior against local HTTP fixtures."
    dependencies:
      - "Phase 2"
      - "Phase 3"
    deliverables:
      - "repobird models and additive models list command wiring."
      - "Human output for identifiers, labels, providers, capabilities, default marker, and safe additive fields."
      - "Stable JSON output and stable non-secret error behavior."
      - "Local integration and built-binary request serialization acceptance."
  - phase: 5
    name: "Documentation, polish, and cost-free acceptance"
    goal: "Align user-facing documentation and run every feasible local validation gate without live or costly calls."
    dependencies:
      - "Phase 4"
    deliverables:
      - "API, configuration, and quick-reference docs explain server authority and optional fields."
      - "Focused package and race tests pass with credentials cleared."
      - "make test, make test-integration, make check, built-binary models checks, git diff --check, and Autospec artifact checks are recorded."

