plan:
  branch: "agent/repobird-cli-5vd"
  created: "2026-08-15"
  spec_path: "specs/002-server-authoritative-models/spec.yaml"

summary: |
  Add a server-authoritative public model discovery path to the existing Go CLI without
  copying the service policy into the client. The API client will decode GET /api/v1/models
  through public DTOs that retain additive safe fields and opaque future values while
  filtering credential, tenant, worker, policy, and hash internals. A built `repobird
  models` command will render deterministic human and stable JSON output and preserve
  documented API errors, ETag metadata, and anonymous-compatible discovery behavior.

  Extend the current run input path so --opencode-model and --opencode-provider, plus
  their JSON/YAML/Markdown configuration fields, travel unchanged through RunConfig,
  domain, repository, and API DTOs. Basic and Pro continue to send their run type and
  existing credential fields but no client-owned model or provider default. Omitted
  selections remain omitted so the server resolves them, and server rejection is
  returned without substitution or retry. The implementation uses focused red tests,
  local httptest fixtures, and built-binary acceptance only; no persistent cache is
  required because a cache is never authoritative for admission.

technical_context:
  language: "Go 1.24.5"
  framework: "Cobra 1.9.1 CLI with existing internal API, domain, repository, configuration, and output layers"
  primary_dependencies:
    - name: "github.com/spf13/cobra"
      version: "v1.9.1"
      purpose: "Register repobird models and preserve existing run and preset command behavior."
    - name: "encoding/json"
      version: "Go standard library"
      purpose: "Decode the public catalog, preserve safe additive fields, filter internal fields, and emit stable JSON."
    - name: "net/http/httptest"
      version: "Go standard library"
      purpose: "Exercise discovery, conditional requests, errors, and run serialization against local servers only."
    - name: "github.com/stretchr/testify"
      version: "v1.10.0"
      purpose: "Express focused DTO, client, repository, command, and compatibility assertions."
  storage: "No new persistent storage. Conditional ETag support is request-scoped; no catalog cache is consulted for run admission."
  testing:
    framework: "Go testing package with testify, fixtures, local httptest servers, and built-binary subprocess acceptance"
    approach: "Write focused failing tests before production edits, implement the smallest transport and command changes, then run focused packages, race tests where practical, make test, make test-integration, make check, built-binary checks, and diff/artifact validation with credentials cleared."
  target_platform: "Linux, macOS, and Windows Go CLI builds supported by the existing repository"
  project_type: "cli"
  performance_goals: "Discovery adds one bounded HTTP request, preserves server cache metadata, and renders a representative catalog without client-side policy computation."
  constraints:
    - "GET /api/v1/models is the only source of public model discovery; the CLI must not maintain a provider catalog or authorize selections locally."
    - "Public DTOs may retain additive safe fields and opaque values but must never retain or render credential, tenant, policy, worker, dispatch, secret, or hash internals."
    - "Basic and Pro run types remain compatible while opencodeModel and opencodeProvider are omitted unless explicitly supplied by the user or configuration."
    - "Explicit selected values are transmitted unchanged; the server owns admission, defaults, credential authorization, and rejection."
    - "Existing authentication, provider credential fields, flags, configuration formats, output contracts, and stable errors remain compatible."
    - "All validation is local, deterministic, credential-cleared, and cost-free. No live RepoBird or provider calls are allowed."
    - "The current assigned worktree and branch are authoritative. Do not edit the sibling repository or the older non-ancestor branch."
  scale_scope: "One public discovery command, one typed catalog client path, additive public DTO decoding, and the existing single-run command/request pipeline."

